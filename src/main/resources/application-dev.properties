# Perfil de desenvolvimento: roda sem PostgreSQL, com H2 salvo em ./data
# Ative com: mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/financas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

jwt.secret=chave-local-de-desenvolvimento-nao-use-em-producao

