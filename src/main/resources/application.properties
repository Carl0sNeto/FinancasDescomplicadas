spring.application.name=financasdescomplicadas
server.port=${PORT:8080}

# PostgreSQL (em produção, configure pelas variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — JWT_SECRET é obrigatório fora do perfil dev (mínimo de 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.validade-ms=${JWT_VALIDADE_MS:86400000}

# Origens do frontend liberadas no CORS, separadas por vírgula
app.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}

# Conta criada na subida, se ainda não existir (ver UsuarioInicialConfig)
app.usuario-inicial.nome=${USUARIO_INICIAL_NOME:}
app.usuario-inicial.email=${USUARIO_INICIAL_EMAIL:}
app.usuario-inicial.senha=${USUARIO_INICIAL_SENHA:}

# Upload de extrato
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
