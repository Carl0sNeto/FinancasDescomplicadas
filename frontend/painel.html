<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Finanças Descomplicadas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main>
    <div class="cabecalho-pagina">
      <h1 id="titulo-mes">Painel</h1>
      <div class="filtros">
        <div class="campo">
          <label for="mes">Mês</label>
          <input id="mes" type="month">
        </div>
      </div>
    </div>

    <a id="aviso-pendentes" class="aviso" href="transacoes.html?pendentes=true" hidden></a>

    <section class="grade grade-indicadores" aria-label="Resumo do mês">
      <div class="cartao indicador">
        <div class="rotulo">Receitas</div>
        <div class="numero receita" id="total-receitas">–</div>
      </div>
      <div class="cartao indicador">
        <div class="rotulo">Despesas</div>
        <div class="numero despesa" id="total-despesas">–</div>
      </div>
      <div class="cartao indicador">
        <div class="rotulo">Saldo do mês</div>
        <div class="numero" id="saldo">–</div>
      </div>
    </section>

    <div class="grade grade-2">
      <section class="cartao">
        <h2>Para onde foi o dinheiro</h2>
        <div id="gastos-categoria"></div>
      </section>

      <section class="cartao">
        <h2>Metas</h2>
        <div id="metas"></div>
      </section>
    </div>

    <section class="cartao">
      <div class="cabecalho-pagina" style="margin-bottom: 8px">
        <h2 style="margin: 0">Últimas transações</h2>
        <a href="transacoes.html">Ver todas</a>
      </div>
      <div class="tabela-rolagem">
        <table>
          <tbody id="ultimas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
